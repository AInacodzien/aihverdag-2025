<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nyhetsbrev - AI hverdag</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .newsletter-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1rem;
      text-align: center;
    }

    .cta-button {
      display: inline-block;
      width: 100%;
      max-width: 300px;
      padding: 8px 16px;
      margin-top: 12px;
      background-color: #00ffe0;
      border: none;
      border-radius: 6px;
      color: black;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
    }

    .status-message {
      max-width: 520px;
      padding: 1rem 1.25rem;
      margin: 1rem 0;
      border: 1px solid #00ffe0;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main>
    <section class="newsletter-form">
      <h1>Nyhetsbrev</h1>
      <p class="status-message">Påmeldingen er midlertidig utilgjengelig mens vi oppdaterer løsningen.</p>
      <a href="../" class="cta-button">Tilbake til forsiden</a>
    </section>
  </main>
</body>
</html>
