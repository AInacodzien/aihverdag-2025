<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>Kontakt oss</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    button {
      background-color: #00ffe0;
      color: black;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #00ccb3;
    }
  </style>
</head>
<body>
  <a id="top"></a>

  <section class="container kontakt-seksjon">
    <h2>Kontakt oss</h2>
    <p>Har du spørsmål, forslag eller ønsker du å samarbeide med oss? Ta kontakt!</p>
    <div class="contact-status">
      <p>Kontaktskjemaet er midlertidig utilgjengelig.</p>
      <p>Du kan kontakte oss på <a href="mailto:kontakt@aihverdag.no">kontakt@aihverdag.no</a>.</p>
    </div>
    <a href="../" class="cta-button back-to-top">Tilbake til forsiden</a>
  </section>
</body>
</html>
